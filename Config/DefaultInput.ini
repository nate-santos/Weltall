[/Script/Engine.InputSettings]
DefaultPlayerInputClass=/Script/EnhancedInput.EnhancedPlayerInput
DefaultInputComponentClass=/Script/EnhancedInput.EnhancedInputComponent
; The phone uses Weltall's own D-pad/button overlay rather than the default dual joysticks.
DefaultTouchInterface=None
; One player: every controller, plugged in before or during play, plays for them beside the keyboard and mouse.
DeviceMappingPolicy=MapAllDevicesToPrimaryUser
